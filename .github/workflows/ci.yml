name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Cancel in-progress runs for the same branch/PR to avoid wasting CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        # --ignore-scripts: @n8n/node-cli depends on isolated-vm, a native build
        # that lint, build and the tests do not need.
        run: 'npm ci --ignore-scripts'

      - name: Run lint
        run: 'npm run lint'

      - name: Run build
        run: 'npm run build'

      - name: Run tests
        # A glob, not a directory: Node 22+ no longer expands a directory argument.
        run: node --test "test/**/*.test.js"
